<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Plataforma de leilões online"><title>LanceCerto | Leilões Online</title><link rel="stylesheet" href="styles.css"></head><body><aside class="sidebar"><div class="brand">Lance<span>Certo</span></div><nav id="nav"><button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="leiloes">⚑ Leilões</button><button data-page="lotes">▣ Lotes</button><button data-page="lances">↗ Lances</button><button data-page="participantes">♙ Participantes</button><button data-page="arrematantes">✓ Arrematantes</button><button data-page="config">⚙ Configurações</button></nav><div class="store"><small>AMBIENTE</small><strong id="companyName">LanceCerto</strong><span>● Banco online</span></div></aside><main><header><button id="menu">☰</button><div><h1 id="title">Dashboard</h1><p id="subtitle">Visão geral dos seus leilões</p></div><div class="user"><span id="userName">Administrador</span> <b>AD</b></div></header><section id="app"></section></main><dialog id="modal"><form method="dialog" id="lotForm"><div class="modal-head"><h2>Novo lote</h2><button value="cancel">×</button></div><label>Título<input id="lname" required placeholder="Ex.: Notebook Gamer"></label><label>Foto do produto<input id="limage" type="file" accept="image/jpeg,image/png,image/webp"><small>A foto será salva online.</small></label><div class="grid2"><label>Valor de avaliação<input id="lvalue" type="number" min="0" step="0.01" required></label><label>Lance inicial<input id="lstart" type="number" min="0" step="0.01" required></label></div><div class="grid2"><label>Incremento mínimo<input id="lstep" type="number" min="1" step="0.01" required></label><label>Duração (minutos)<input id="lduration" type="number" min="1" value="180" required></label></div><label>Descrição<input id="ldesc" placeholder="Informações do lote"></label><div class="actions"><button value="cancel" class="ghost">Cancelar</button><button id="saveLot" value="default" class="primary">Criar lote</button></div></form></dialog><dialog id="registerModal"><form id="registerForm"><div class="modal-head"><h2>Cadastro para participar</h2><button type="button" onclick="registerModal.close()">×</button></div><p class="muted">Crie seu acesso para participar deste leilão.</p><label>Nome completo<input id="rname" required autocomplete="name"></label><div class="grid2"><label>CPF<input id="rcpf" required inputmode="numeric" placeholder="000.000.000-00"></label><label>WhatsApp<input id="rphone" required inputmode="tel" placeholder="(41) 99999-9999"></label></div><label>E-mail<input id="remail" type="email" required autocomplete="email"></label><label>Senha<input id="rpassword" type="password" minlength="6" required autocomplete="new-password"></label><label class="terms"><input id="rterms" type="checkbox" required> Confirmo que os dados são verdadeiros e aceito as regras do leilão.</label><button class="primary full" type="submit">Cadastrar e participar</button></form></dialog><script>if(new URLSearchParams(location.search).has('lote'))document.body.classList.add('public-lot')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
