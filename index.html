<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Plataforma demonstrativa de leilões online"><title>LanceCerto | Leilões Online</title><link rel="stylesheet" href="styles.css"></head><body><aside class="sidebar"><div class="brand">Lance<span>Certo</span></div><nav id="nav"><button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="leiloes">⚑ Leilões</button><button data-page="lotes">▣ Lotes</button><button data-page="lances">↗ Lances</button><button data-page="participantes">♙ Participantes</button><button data-page="arrematantes">✓ Arrematantes</button><button data-page="config">⚙ Configurações</button></nav><div class="store"><small>AMBIENTE</small><strong>Leiloeira Demo</strong><span>● Online</span></div></aside><main><header><button id="menu">☰</button><div><h1 id="title">Dashboard</h1><p id="subtitle">Visão geral dos seus leilões</p></div><div class="user">Administrador <b>AD</b></div></header><section id="app"></section></main><dialog id="modal"><form method="dialog" id="lotForm"><div class="modal-head"><h2>Novo lote</h2><button value="cancel">×</button></div><label>Título<input id="lname" required placeholder="Ex.: Notebook Gamer"></label><div class="grid2"><label>Valor de avaliação<input id="lvalue" type="number" min="0" step="0.01" required></label><label>Lance inicial<input id="lstart" type="number" min="0" step="0.01" required></label></div><div class="grid2"><label>Incremento mínimo<input id="lstep" type="number" min="1" step="0.01" required></label><label>Duração (minutos)<input id="lduration" type="number" min="1" value="180" required></label></div><label>Descrição<input id="ldesc" placeholder="Informações do lote"></label><div class="actions"><button value="cancel" class="ghost">Cancelar</button><button id="saveLot" value="default" class="primary">Criar lote</button></div></form></dialog><script src="app.js"></scri
