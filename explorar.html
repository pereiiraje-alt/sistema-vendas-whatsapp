<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Leilões ao vivo de empresas na plataforma JP Leilões">
  <meta name="theme-color" content="#0b2a20">
  <title>Leilões da Plataforma | JP Leilões</title>
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="brand.css?v=20260929-1">
  <style>
    body{background:#f5f8f6;margin:0;color:#10211b}.market-header{position:sticky;top:0;z-index:10;background:#0b2a20;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.market-header strong{font-size:20px}.market-header a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:9px 13px;border-radius:10px}.market{max-width:1250px;margin:0 auto;padding:36px 20px 70px}.hero{text-align:center;margin-bottom:28px}.hero h1{margin:8px 0;font-size:34px}.hero p{margin:0;color:#67766f}.live-pill{display:inline-flex;align-items:center;gap:6px;background:#e7f8ee;color:#118044;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.card{background:#fff;border:1px solid #dfe8e3;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(11,42,32,.07)}.cover{height:185px;background:#0b2a20;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.company{font-size:13px;color:#138548;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.body h2{font-size:21px;margin:7px 0 11px}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#68766f;font-size:13px}.valuation{margin:14px 0 0;color:#53615b;font-size:14px}.valuation b{color:#10211b}.price{font-size:19px;font-weight:900;margin:10px 0 16px}.join{display:block;text-align:center;text-decoration:none;background:#18bd63;color:#fff;font-weight:800;padding:13px 14px;border-radius:11px}.empty{grid-column:1/-1;background:#fff;border:1px solid #dfe8e3;border-radius:16px;padding:30px;text-align:center;color:#67766f}@media(max-width:650px){.market{padding:28px 14px 55px}.hero h1{font-size:28px}.market-header{padding:12px 14px}}
  </style>
</head>
<body>
  <header class="market-header"><strong>JP Leilões</strong><a href="/">← Voltar ao painel</a></header>
  <main class="market">
    <section class="hero"><span class="live-pill">● LEILÕES AO VIVO</span><h1>Leilões da plataforma</h1><p>Veja leilões de outras empresas e participe usando o mesmo cadastro.</p></section>
    <div id="grid" class="grid"><div class="empty">Carregando leilões...</div></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
  (async()=>{
    const grid=document.getElementById('grid');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const fmt=v=>v?new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'Em andamento';
    try{
      const db=window.supabase.createClient('https://dsgnyfnddyxilakjwavu.supabase.co','sb_publishable_4-pk8-WndWKwy_8plTVTAA_KXUNf-Lr');
      const {data:auctions,error}=await db.rpc('public_live_auctions');
      if(error)throw error;
      const now=Date.now();
      const active=(auctions||[]).filter(a=>!a.ends_at||new Date(a.ends_at).getTime()>now);
      if(!active.length){grid.innerHTML='<div class="empty"><b>Nenhum leilão ao vivo neste momento.</b><br>Volte em breve para conferir novos leilões.</div>';return;}
      const ids=active.map(a=>a.id);
      const {data:lots,error:lotsError}=await db.from('lots').select('id,auction_id,title,image_url,current_bid,starting_bid,valuation,lot_number,ends_at,status').in('auction_id',ids).eq('status','live').order('lot_number',{ascending:true});
      if(lotsError)throw lotsError;
      const first=new Map();
      (lots||[]).forEach(l=>{if((!l.ends_at||new Date(l.ends_at).getTime()>now)&&!first.has(String(l.auction_id)))first.set(String(l.auction_id),l)});
      const visible=active.filter(a=>first.has(String(a.id)));
      if(!visible.length){grid.innerHTML='<div class="empty"><b>Nenhum lote disponível para lances agora.</b></div>';return;}
      grid.innerHTML=visible.map(a=>{
        const l=first.get(String(a.id));
        const cover=l.image_url?`<img src="${esc(l.image_url)}" alt="${esc(l.title||a.title)}">`:'🔨';
        return `<article class="card"><div class="cover">${cover}</div><div class="body"><div class="company">${esc(a.company_name||'Empresa parceira')}</div><h2>${esc(a.title||l.title||'Leilão ao vivo')}</h2><div class="meta"><span class="live-pill">● Ao vivo</span><span>Termina ${fmt(a.ends_at||l.ends_at)}</span></div><div class="valuation">Valor de avaliação: <b>${money(l.valuation)}</b></div><div class="price">Lance atual: ${money(l.current_bid||l.starting_bid)}</div><a class="join" href="/?lote=${encodeURIComponent(l.id)}">Ver leilão e dar lance</a></div></article>`;
      }).join('');
    }catch(e){console.error(e);grid.innerHTML='<div class="empty">Não foi possível carregar os leilões agora. Tente novamente em alguns instantes.</div>';}
  })();
  </script>
</body>
</html>
