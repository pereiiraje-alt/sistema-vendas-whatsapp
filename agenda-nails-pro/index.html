<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda Nails Pro</title>
<meta name="description" content="Agenda inteligente para manicures e esmalterias">
<style>
:root{--bg:#f7f4f3;--card:#fff;--ink:#2f252a;--muted:#8e8086;--line:#eadfe2;--wine:#694857;--wine2:#96677a;--rose:#f3e3e9;--green:#e5f2ec;--gold:#f5ebd8;--shadow:0 18px 48px rgba(85,60,70,.09)}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#392e33;color:#f8f0f3;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#d8aabb,#86586b);display:grid;place-items:center;font:700 21px Georgia;color:#fff}.brand b{display:block;font-size:17px}.brand small{display:block;color:#bdaab2;margin-top:3px;letter-spacing:1px}.studio{border:1px solid #5a4a51;background:#44373d;border-radius:15px;padding:12px;margin-bottom:18px}.studio b,.studio small{display:block}.studio small{color:#bcaab1;margin-top:3px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cdbdc3;padding:11px 12px;border-radius:12px;text-align:left;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:#f3e7ec;color:#5d414e}.upgrade{margin-top:24px;background:linear-gradient(145deg,#674755,#4a3941);border-radius:16px;padding:15px;color:#eadce1}.upgrade b{color:#fff}.upgrade p{font-size:11px;line-height:1.5}.main{min-width:0}.top{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10;background:rgba(247,244,243,.93);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.top h1{font-size:19px;margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:11px}.actions{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:750;cursor:pointer}.primary{background:var(--wine);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.avatar{width:38px;height:38px;border-radius:12px;background:#5f4651;color:white;display:grid;place-items:center;font-weight:800}.content{padding:28px;max-width:1450px;margin:auto}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}.intro h2{font:600 30px Georgia;margin:3px 0 6px}.intro h2 span{color:#a66f83}.intro p{margin:0;color:var(--muted)}.eyebrow{font-size:9px;letter-spacing:1.5px;font-weight:800;color:#9b7d89}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.metric,.panel{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.metric{border-radius:18px;padding:18px}.metric span{color:var(--muted);font-size:11px}.metric b{display:block;font-size:27px;margin:9px 0 6px}.metric small{color:#927f86}.positive{color:#497864!important}.grid{display:grid;grid-template-columns:1.55fr .75fr;gap:16px}.panel{border-radius:21px;padding:19px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.head h3{margin:2px 0 0}.datebar{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}.date{width:50px;text-align:center;padding:8px;border-radius:11px}.date small{display:block;color:var(--muted);font-size:9px}.date b{display:block;margin-top:3px}.date.on{background:var(--wine);color:#fff}.date.on small{color:#eadce1}.appointment{display:grid;grid-template-columns:60px 4px 1fr 100px 90px;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid #f1e9eb}.appointment .line{height:38px;border-radius:6px;background:#d5aabb}.appointment b,.appointment small{display:block}.appointment small{color:var(--muted);margin-top:3px}.status{padding:6px 8px;border-radius:999px;background:var(--green);color:#4d7564;font-size:9px;font-weight:800;text-align:center}.status.pending{background:var(--gold);color:#846334}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px;text-align:left}.quick b{display:block;margin-top:8px}.quick small{display:block;color:var(--muted);margin-top:3px}.bars{height:135px;display:flex;align-items:flex-end;gap:9px}.bar{flex:1;background:linear-gradient(#a66f83,#ead0da);border-radius:7px 7px 3px 3px}.list{display:grid;gap:9px}.row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:14px}.round{width:38px;height:38px;border-radius:12px;background:var(--rose);display:grid;place-items:center;font-weight:800}.page{display:none}.page.active{display:block}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.search{flex:1;max-width:420px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:10px}.servicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.service{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.service .icon{width:42px;height:42px;border-radius:13px;background:var(--rose);display:grid;place-items:center;font-size:20px}.service h3{margin:13px 0 6px}.service p{color:var(--muted);min-height:34px}.service footer{display:flex;justify-content:space-between;font-weight:800}.whatsappHero{background:linear-gradient(135deg,#503b44,#72515f);color:#fff;border-radius:22px;padding:23px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}.waStatus{background:#ddf1e6;color:#2f6f52;padding:9px 12px;border-radius:999px;font-weight:800}.automations{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.auto{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;display:flex;justify-content:space-between;gap:15px}.toggle{width:44px;height:25px;border-radius:999px;background:#d7ced1;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}.toggle.on{background:#6a9c84}.toggle.on:after{left:22px}.financegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.financecard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.financecard b{display:block;font-size:25px;margin-top:8px}.booking{min-height:100vh;background:linear-gradient(135deg,#f7eff2,#efe7e4);padding:35px}.bookingWrap{max-width:1040px;margin:auto;display:grid;grid-template-columns:.85fr 1.15fr;gap:28px;align-items:center}.bookingBrand h1{font:600 44px Georgia;line-height:1.08}.bookingBrand p{color:#75666c;line-height:1.7}.bookCard{background:#fff;border:1px solid var(--line);box-shadow:0 26px 70px rgba(80,50,62,.13);border-radius:26px;padding:24px}.steps{display:flex;gap:6px;margin-bottom:20px}.steps i{height:4px;background:#eadfe2;flex:1;border-radius:9px}.steps i.on{background:#8f6173}.choices{display:grid;gap:10px}.choice{border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.choice:hover{border-color:#b78b9b;background:#fff9fb}.choice b,.choice small{display:block}.choice small{color:var(--muted);margin-top:4px}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.times button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}.field{display:grid;gap:5px;margin-bottom:12px}.field span{font-size:10px;font-weight:800}.field input{border:1px solid var(--line);border-radius:12px;padding:12px}.success{text-align:center;padding:30px}.success i{width:64px;height:64px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 15px;font-size:28px;font-style:normal}.toast{position:fixed;right:22px;bottom:22px;background:#382d32;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:99}@media(max-width:1050px){.app{grid-template-columns:80px 1fr}.side{padding:20px 10px}.brand div:not(.logo),.studio,.upgrade,.nav span{display:none}.nav button{justify-content:center}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.servicegrid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.app{display:block}.side{height:auto;position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;padding:7px;background:#392e33}.brand,.studio,.upgrade{display:none}.nav{grid-template-columns:repeat(5,1fr)}.nav button:nth-child(n+6){display:none}.nav button{padding:9px}.main{padding-bottom:70px}.top{padding:0 14px;height:68px}.top p,.actions .secondary{display:none}.content{padding:18px 13px}.intro{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:1fr 1fr;gap:9px}.metric{padding:14px}.metric b{font-size:21px}.appointment{grid-template-columns:50px 3px 1fr}.appointment>:nth-child(4),.appointment>:nth-child(5){display:none}.servicegrid,.automations,.financegrid{grid-template-columns:1fr}.booking{padding:20px 12px}.bookingWrap{grid-template-columns:1fr}.bookingBrand h1{font-size:34px}.table{font-size:11px}}
</style>
</head>
<body><div id="root"></div><div id="toast" hidden class="toast"></div>
<script>
const data={appointments:[['09:00','Mariana Costa','Manicure em Gel','Ana Souza','confirmed'],['10:30','Camila Rocha','Pé + Mão','Bruna Lima','confirmed'],['13:00','Juliana Alves','Alongamento Fibra','Ana Souza','pending'],['15:00','Patrícia Melo','Manutenção','Carla Dias','confirmed'],['17:30','Fernanda Luz','Spa dos Pés','Bruna Lima','confirmed']],clients:[['Mariana Costa','(41) 99912-2233','12','R$ 1.240'],['Camila Rocha','(41) 98822-3344','8','R$ 790'],['Juliana Alves','(41) 97731-5532','19','R$ 2.480'],['Patrícia Melo','(41) 96641-8821','6','R$ 620']],services:[['Manicure Tradicional','Mãos','45 min','R$ 35'],['Pé + Mão','Combo','90 min','R$ 65'],['Esmaltação em Gel','Mãos','75 min','R$ 75'],['Alongamento Fibra','Alongamento','150 min','R$ 160'],['Manutenção de Fibra','Alongamento','120 min','R$ 95'],['Spa dos Pés','Pés','60 min','R$ 70']]};let current='dashboard',bookStep=1,book={service:'',pro:'',time:''};
const root=document.getElementById('root');
const titles={dashboard:['Visão geral','Resumo do seu estúdio hoje'],agenda:['Agenda','Organize horários e profissionais'],clients:['Clientes','Histórico e relacionamento'],services:['Serviços','Catálogo, preços e duração'],finance:['Financeiro','Receitas, despesas e desempenho'],whatsapp:['WhatsApp','Confirmações e lembretes automáticos'],booking:['Agendamento online','Página pública da cliente']};
function side(){return `<aside class="side"><div class="brand"><div class="logo">AN</div><div><b>Agenda Nails</b><small>PRO</small></div></div><div class="studio"><b>Bella Nails Studio</b><small>Curitiba · PR</small></div><nav class="nav">${[['dashboard','⌂','Dashboard'],['agenda','▦','Agenda'],['clients','♙','Clientes'],['services','◇','Serviços'],['finance','R$','Financeiro'],['whatsapp','◉','WhatsApp'],['booking','↗','Página pública']].map(x=>`<button class="${current===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</nav><div class="upgrade"><b>Plano Profissional</b><p>Agenda online, equipe, financeiro e automações em um só lugar.</p></div></aside>`}
function shell(content){let t=titles[current];return `<div class="app">${side()}<main class="main"><header class="top"><div><h1>${t[0]}</h1><p>${t[1]}</p></div><div class="actions"><button class="btn secondary" onclick="go('booking')">Ver página pública</button><button class="btn primary" onclick="toast('Novo agendamento aberto')">+ Agendar</button><div class="avatar">AS</div></div></header><div class="content">${content}</div></main></div>`}
function dashboard(){return shell(`<section class="intro"><div><span class="eyebrow">DOMINGO, 04 OUTUBRO</span><h2>Bom dia, <span>Ana.</span></h2><p>Seu estúdio está com 84% de ocupação nesta semana.</p></div><button class="btn primary" onclick="go('booking')">+ Novo agendamento</button></section><section class="metrics"><div class="metric"><span>Faturamento hoje</span><b>R$ 1.485</b><small class="positive">▲ 18% vs. domingo anterior</small></div><div class="metric"><span>Agendamentos</span><b>14</b><small>11 confirmados · 3 pendentes</small></div><div class="metric"><span>Novas clientes</span><b>6</b><small class="positive">▲ 3 nesta semana</small></div><div class="metric"><span>Ocupação semanal</span><b>84%</b><small>Meta: 80%</small></div></section><div class="grid"><section class="panel"><div class="head"><div><span class="eyebrow">AGENDA</span><h3>Próximos horários</h3></div><button class="btn secondary" onclick="go('agenda')">Ver agenda</button></div><div class="datebar">${[['DOM','4'],['SEG','5'],['TER','6'],['QUA','7'],['QUI','8'],['SEX','9'],['SÁB','10']].map((d,i)=>`<div class="date ${i===0?'on':''}"><small>${d[0]}</small><b>${d[1]}</b></div>`).join('')}</div>${data.appointments.map((a,i)=>`<div class="appointment"><b>${a[0]}</b><span class="line" style="background:${['#d9aebe','#c5d9d1','#d7cbe5','#ead8b9','#d9aebe'][i]}"></span><div><b>${a[1]}</b><small>${a[2]} · ${a[3]}</small></div><b>R$ ${[75,65,160,95,70][i]}</b><span class="status ${a[4]==='pending'?'pending':''}">${a[4]==='pending'?'Pendente':'Confirmado'}</span></div>`).join('')}</section><aside><section class="panel" style="margin-bottom:16px"><div class="head"><div><span class="eyebrow">FATURAMENTO</span><h3>Últimos 7 dias</h3></div></div><b style="font-size:25px">R$ 6.840</b><div class="bars">${[45,62,50,75,67,92,78].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div></section><section class="panel"><div class="head"><h3>Acesso rápido</h3></div><div class="quick"><button onclick="go('clients')">♡<b>Cliente</b><small>Cadastrar</small></button><button onclick="go('services')">◇<b>Serviço</b><small>Editar catálogo</small></button><button onclick="go('whatsapp')">◉<b>WhatsApp</b><small>Automações</small></button><button onclick="go('finance')">R$<b>Financeiro</b><small>Ver caixa</small></button></div></section></aside></div>`)}
function agenda(){return shell(`<div class="toolbar"><input class="search" placeholder="Buscar cliente, serviço ou profissional"><button class="btn primary" onclick="toast('Novo horário')">+ Novo horário</button></div><section class="panel"><div class="head"><div><span class="eyebrow">SEMANA 04–10 OUT</span><h3>Agenda da equipe</h3></div><span class="status">84% ocupada</span></div>${data.appointments.concat([['18:30','Renata Vaz','Esmaltação em Gel','Carla Dias','confirmed']]).map((a,i)=>`<div class="appointment"><b>${a[0]}</b><span class="line" style="background:${i%2?'#c5d9d1':'#d9aebe'}"></span><div><b>${a[1]}</b><small>${a[2]} · ${a[3]}</small></div><b>${i%2?'60 min':'75 min'}</b><span class="status ${a[4]==='pending'?'pending':''}">${a[4]==='pending'?'Pendente':'Confirmado'}</span></div>`).join('')}</section>`)}
function clients(){return shell(`<div class="toolbar"><input class="search" placeholder="Buscar cliente por nome ou WhatsApp"><button class="btn primary" onclick="toast('Cadastro de cliente aberto')">+ Nova cliente</button></div><section class="panel"><div class="head"><div><span class="eyebrow">RELACIONAMENTO</span><h3>Base de clientes</h3></div><span>248 clientes ativas</span></div><table class="table"><thead><tr><th>CLIENTE</th><th>WHATSAPP</th><th>VISITAS</th><th>TOTAL GASTO</th><th>STATUS</th></tr></thead><tbody>${data.clients.map((c,i)=>`<tr><td><b>${c[0]}</b><br><small style="color:var(--muted)">Última visita: ${i+1}/10/2026</small></td><td>${c[1]}</td><td>${c[2]}</td><td><b>${c[3]}</b></td><td><span class="status">${i===2?'VIP':'Ativa'}</span></td></tr>`).join('')}</tbody></table></section>`)}
function services(){return shell(`<div class="toolbar"><div><span class="eyebrow">CATÁLOGO</span><h2 style="margin:4px 0">Serviços do estúdio</h2></div><button class="btn primary" onclick="toast('Novo serviço')">+ Novo serviço</button></div><div class="servicegrid">${data.services.map((s,i)=>`<article class="service"><div class="icon">${['💅','♡','✦','◇','↻','♨'][i]}</div><span class="eyebrow">${s[1]}</span><h3>${s[0]}</h3><p>Serviço disponível para agendamento online com profissionais habilitadas.</p><footer><span>${s[2]}</span><b>${s[3]}</b></footer></article>`).join('')}</div>`)}
function finance(){return shell(`<div class="financegrid"><div class="financecard"><span>Receita no mês</span><b>R$ 18.940</b><small class="positive">▲ 12,4%</small></div><div class="financecard"><span>Despesas</span><b>R$ 5.280</b><small>Produtos, aluguel e taxas</small></div><div class="financecard"><span>Resultado líquido</span><b>R$ 13.660</b><small class="positive">Margem 72%</small></div></div><div class="grid"><section class="panel"><div class="head"><div><span class="eyebrow">MOVIMENTAÇÕES</span><h3>Últimos lançamentos</h3></div></div><table class="table"><tbody>${[['04/10','Manicure em Gel · Mariana','+ R$ 75'],['04/10','Pé + Mão · Camila','+ R$ 65'],['03/10','Compra de esmaltes','− R$ 320'],['03/10','Alongamento · Juliana','+ R$ 160'],['02/10','Material descartável','− R$ 98']].map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><b style="color:${r[2][0]==='+'?'#497864':'#a75b5b'}">${r[2]}</b></td></tr>`).join('')}</tbody></table></section><section class="panel"><span class="eyebrow">FORMAS DE PAGAMENTO</span><h3>Recebimentos</h3><div class="list"><div class="row"><div class="round">PIX</div><div><b>PIX</b><small>46% das vendas</small></div><b>R$ 8.712</b></div><div class="row"><div class="round">▣</div><div><b>Cartão</b><small>39% das vendas</small></div><b>R$ 7.387</b></div><div class="row"><div class="round">$</div><div><b>Dinheiro</b><small>15% das vendas</small></div><b>R$ 2.841</b></div></div></section></div>`)}
function whatsapp(){return shell(`<section class="whatsappHero"><div><span class="eyebrow" style="color:#e7cbd5">AUTOMAÇÃO</span><h2 style="margin:6px 0">WhatsApp conectado</h2><p style="margin:0;color:#dbcbd1">Número demonstrativo · nenhuma mensagem real será enviada.</p></div><span class="waStatus">● Conectado</span></section><div class="automations">${[['Confirmação de agendamento','Enviar assim que a cliente reservar um horário'],['Lembrete 24 horas antes','Reduzir faltas e permitir confirmação'],['Lembrete 2 horas antes','Reforço no dia do atendimento'],['Cancelamento e remarcação','Avisar mudanças automaticamente'],['Pós-atendimento','Agradecimento + pedido de avaliação'],['Aniversário da cliente','Mensagem personalizada de fidelização']].map((a,i)=>`<div class="auto"><div><b>${a[0]}</b><p style="margin:5px 0;color:var(--muted);font-size:11px">${a[1]}</p></div><div class="toggle ${i<4?'on':''}" onclick="this.classList.toggle('on');toast('Automação atualizada')"></div></div>`).join('')}</div><section class="panel" style="margin-top:16px"><div class="head"><div><span class="eyebrow">MODELO DE MENSAGEM</span><h3>Confirmação</h3></div></div><div style="background:#f8f3f5;border-radius:15px;padding:16px;line-height:1.7">💅 Olá, <b>{nome}</b>! Seu horário no <b>{empresa}</b> foi confirmado.<br>📅 {data} às {hora}<br>✨ {servico}<br>👩 {profissional}<br><br>Esperamos você! ♡</div></section>`)}
function booking(){return `<div class="booking"><div class="bookingWrap"><section class="bookingBrand"><div class="logo">BN</div><span class="eyebrow">BELLA NAILS STUDIO</span><h1>Seu momento de beleza, do seu jeito.</h1><p>Agende em poucos passos. Escolha serviço, profissional e horário sem precisar ligar ou mandar mensagem.</p><button class="btn secondary" onclick="go('dashboard')">← Voltar ao painel</button></section><section class="bookCard"><div class="steps">${[1,2,3,4].map(i=>`<i class="${bookStep>=i?'on':''}"></i>`).join('')}</div>${bookingBody()}</section></div></div>`}
function bookingBody(){if(bookStep===1)return `<span class="eyebrow">PASSO 1 DE 4</span><h2>Qual serviço você deseja?</h2><div class="choices">${data.services.slice(0,5).map(s=>`<div class="choice" onclick="chooseService('${s[0]}')"><div><b>${s[0]}</b><small>${s[2]} · ${s[1]}</small></div><b>${s[3]}</b></div>`).join('')}</div>`;if(bookStep===2)return `<span class="eyebrow">PASSO 2 DE 4</span><h2>Escolha a profissional</h2><div class="choices">${[['Ana Souza','Especialista em gel'],['Bruna Lima','Manicure e pedicure'],['Carla Dias','Alongamentos']].map(p=>`<div class="choice" onclick="choosePro('${p[0]}')"><div><b>${p[0]}</b><small>${p[1]}</small></div><span>›</span></div>`).join('')}</div><button class="btn secondary" style="margin-top:12px" onclick="backBook()">← Voltar</button>`;if(bookStep===3)return `<span class="eyebrow">PASSO 3 DE 4</span><h2>Escolha o horário</h2><p style="color:var(--muted)">Terça-feira, 06 de outubro</p><div class="times">${['09:00','10:30','13:00','14:30','16:00','17:30'].map(t=>`<button onclick="chooseTime('${t}')">${t}</button>`).join('')}</div><button class="btn secondary" style="margin-top:12px" onclick="backBook()">← Voltar</button>`;if(bookStep===4)return `<span class="eyebrow">PASSO 4 DE 4</span><h2>Quase pronto ♡</h2><div class="field"><span>SEU NOME</span><input id="name" placeholder="Nome completo"></div><div class="field"><span>WHATSAPP</span><input id="phone" placeholder="(41) 99999-9999"></div><div style="background:#faf5f7;padding:13px;border-radius:13px;margin:12px 0"><b>${book.service}</b><br><small>${book.pro} · 06/10/2026 às ${book.time}</small></div><button class="btn primary" style="width:100%" onclick="confirmBook()">Confirmar agendamento</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="backBook()">Voltar</button>`;return `<div class="success"><i>✓</i><span class="eyebrow">AGENDAMENTO CONFIRMADO</span><h2>Seu horário está reservado!</h2><p>Uma confirmação será enviada para o WhatsApp cadastrado quando a integração real estiver ativada.</p><div style="background:#faf5f7;padding:15px;border-radius:14px;margin:18px 0"><b>${book.service}</b><br>${book.pro} · 06/10/2026 às ${book.time}</div><button class="btn primary" onclick="resetBook()">Fazer outro agendamento</button></div>`}
function go(p){current=p;bookStep=p==='booking'?bookStep:1;render()}function chooseService(v){book.service=v;bookStep=2;render()}function choosePro(v){book.pro=v;bookStep=3;render()}function chooseTime(v){book.time=v;bookStep=4;render()}function backBook(){bookStep=Math.max(1,bookStep-1);render()}function confirmBook(){if(!document.getElementById('name').value||!document.getElementById('phone').value)return toast('Preencha nome e WhatsApp');bookStep=5;render()}function resetBook(){bookStep=1;book={service:'',pro:'',time:''};render()}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2200)}function render(){if(current==='booking'){root.innerHTML=booking();return}let f={dashboard,agenda,clients,services,finance,whatsapp}[current]||dashboard;root.innerHTML=f()}render();
</script></body></html>
