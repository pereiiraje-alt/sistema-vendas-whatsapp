<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda Nails Pro</title>
<meta name="description" content="Agenda simples para manicures e esmalterias">
<style>
:root{--bg:#f8f5f5;--card:#fff;--ink:#2e2529;--muted:#887b80;--line:#eadfe2;--wine:#694857;--wine2:#956779;--rose:#f5e7ec;--green:#e3f2ea;--gold:#f7edd8;--shadow:0 10px 30px rgba(70,45,55,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{position:sticky;top:0;height:100vh;background:#392e33;color:#fff;padding:22px 14px}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#d8aabb,#86586b);display:grid;place-items:center;font:700 20px Georgia}.brand b{display:block;font-size:16px}.brand small{color:#c8b7bd;letter-spacing:1px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#cdbfc4;border-radius:12px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:#f3e7ec;color:#5d414e}.main{min-width:0}.top{height:72px;position:sticky;top:0;z-index:20;background:rgba(248,245,245,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:0 26px;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:11px}.actions{display:flex;gap:8px;align-items:center}.avatar{width:38px;height:38px;border-radius:12px;background:var(--wine);color:#fff;display:grid;place-items:center;font-weight:800}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:var(--wine);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.content{padding:24px;max-width:1180px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.hero h2{font:600 30px Georgia;margin:4px 0 5px}.hero h2 span{color:var(--wine2)}.hero p{margin:0;color:var(--muted)}.eyebrow{font-size:9px;letter-spacing:1.4px;font-weight:900;color:#9d818c;text-transform:uppercase}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.metric,.panel,.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.metric{border-radius:17px;padding:16px}.metric span{font-size:11px;color:var(--muted)}.metric b{display:block;font-size:24px;margin:8px 0 4px}.metric small{color:var(--muted)}.positive{color:#4e7b67!important}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:14px}.panel{border-radius:20px;padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.head h3{margin:2px 0 0}.appointment{display:grid;grid-template-columns:58px 4px 1fr 92px;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #f1e9eb}.appointment:last-child{border-bottom:0}.appointment .line{height:38px;border-radius:9px;background:#d5aabb}.appointment b,.appointment small{display:block}.appointment small{color:var(--muted);margin-top:3px}.status{display:inline-flex;align-items:center;justify-content:center;background:var(--green);color:#49725f;border-radius:999px;padding:6px 8px;font-size:9px;font-weight:900}.status.pending{background:var(--gold);color:#836434}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px;text-align:left}.quick b{display:block;margin-top:7px}.quick small{display:block;color:var(--muted);margin-top:3px}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.search{flex:1;max-width:420px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}.list{display:grid;gap:10px}.card{border-radius:17px;padding:15px}.client{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center}.round{width:42px;height:42px;border-radius:13px;background:var(--rose);display:grid;place-items:center;font-weight:900}.client b,.client small{display:block}.client small{color:var(--muted);margin-top:4px}.servicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.service h3{margin:9px 0 5px}.service p{color:var(--muted);min-height:34px}.service footer{display:flex;justify-content:space-between;font-weight:900}.financegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.financecard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px}.financecard span{color:var(--muted)}.financecard b{display:block;font-size:24px;margin:8px 0 4px}.waHero{background:linear-gradient(135deg,#503b44,#72515f);color:#fff;border-radius:20px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.waHero p{color:#ddcfd4;margin:5px 0 0}.auto{display:flex;align-items:center;justify-content:space-between;gap:12px}.toggle{width:46px;height:26px;border-radius:999px;background:#d7ced1;position:relative;flex:0 0 auto}.toggle:after{content:"";position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;left:3px;top:3px;transition:.18s}.toggle.on{background:#6c9d86}.toggle.on:after{left:23px}.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.moreitem{border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px;text-align:left}.moreitem strong{display:block;font-size:15px;margin:8px 0 4px}.moreitem small{color:var(--muted)}.bottom{display:none}.booking{min-height:100vh;background:linear-gradient(135deg,#f7eff2,#efe7e4);padding:30px}.bookingWrap{max-width:980px;margin:auto;display:grid;grid-template-columns:.85fr 1.15fr;gap:24px;align-items:center}.bookingBrand h1{font:600 42px Georgia;line-height:1.08;margin:12px 0}.bookingBrand p{line-height:1.7;color:#75666c}.bookCard{background:#fff;border:1px solid var(--line);box-shadow:0 24px 65px rgba(80,50,62,.13);border-radius:24px;padding:22px}.steps{display:flex;gap:6px;margin-bottom:18px}.steps i{height:4px;background:#eadfe2;flex:1;border-radius:9px}.steps i.on{background:#8f6173}.choices{display:grid;gap:9px}.choice{border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;justify-content:space-between;align-items:center}.choice b,.choice small{display:block}.choice small{color:var(--muted);margin-top:4px}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.times button{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px}.field{display:grid;gap:5px;margin-bottom:12px}.field span{font-size:10px;font-weight:900}.field input{border:1px solid var(--line);border-radius:12px;padding:13px}.success{text-align:center;padding:22px}.success i{width:62px;height:62px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 14px;font-size:27px;font-style:normal}.toast{position:fixed;right:18px;bottom:18px;background:#382d32;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);z-index:100}
@media(max-width:900px){.app{grid-template-columns:78px 1fr}.side{padding:18px 9px}.brand>div:not(.logo),.nav span{display:none}.brand{justify-content:center}.nav button{justify-content:center}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.servicegrid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){
body{font-size:15px}.app{display:block}.side{display:none}.main{padding-bottom:88px}.top{height:62px;padding:0 15px}.top h1{font-size:18px}.top p,.actions .secondary,.avatar{display:none}.top .primary{padding:10px 12px;font-size:13px}.content{padding:14px 12px 18px}.hero{align-items:flex-start;flex-direction:column;margin-bottom:14px}.hero h2{font-size:27px;margin:2px 0 4px}.hero p{font-size:13px}.hero>.primary{width:100%;min-height:48px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:13px;border-radius:15px;box-shadow:none}.metric b{font-size:20px}.metric small{font-size:11px}.metric:nth-child(n+3){display:none}.panel{padding:14px;border-radius:17px;box-shadow:none}.grid{gap:10px}.grid>aside{display:none}.head .secondary{display:none}.appointment{grid-template-columns:52px 3px 1fr;gap:9px;padding:12px 0}.appointment>:nth-child(4){display:none}.appointment b{font-size:14px}.toolbar{align-items:stretch}.toolbar .search{max-width:none}.toolbar .primary{white-space:nowrap}.client{grid-template-columns:42px 1fr}.client>div:last-child{display:none}.servicegrid,.financegrid,.moregrid{grid-template-columns:1fr}.service p{min-height:0}.waHero{align-items:flex-start;flex-direction:column;padding:17px}.auto{min-height:56px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:70;left:0;right:0;bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -8px 25px rgba(60,40,50,.07)}.bottom button{border:0;background:transparent;color:#8d7d83;border-radius:12px;min-height:55px;font-size:10px;font-weight:800;display:grid;place-items:center;gap:1px}.bottom button b{display:block;font-size:19px;line-height:1}.bottom button.active{background:#f5e9ed;color:var(--wine)}.booking{padding:14px 10px 26px}.bookingWrap{grid-template-columns:1fr;gap:12px}.bookingBrand{display:flex;align-items:center;gap:10px}.bookingBrand h1,.bookingBrand p,.bookingBrand .eyebrow{display:none}.bookingBrand .secondary{margin-left:auto;padding:9px 11px}.bookCard{padding:17px 14px;border-radius:20px}.bookCard h2{font-size:21px}.choice{min-height:58px;padding:13px}.times{grid-template-columns:1fr 1fr}.field input{min-height:48px}.toast{left:12px;right:12px;bottom:84px;text-align:center}
}
</style>
</head>
<body>
<div id="root"></div><div id="toast" class="toast" hidden></div>
<script>
const data={
appointments:[
['09:00','Mariana Costa','Manicure em Gel','Ana Souza','confirmed'],
['10:30','Camila Rocha','Pé + Mão','Bruna Lima','confirmed'],
['13:00','Juliana Alves','Alongamento Fibra','Ana Souza','pending'],
['15:00','Patrícia Melo','Manutenção','Carla Dias','confirmed'],
['17:30','Fernanda Luz','Spa dos Pés','Bruna Lima','confirmed']],
clients:[
['Mariana Costa','(41) 99912-2233','12','R$ 1.240'],
['Camila Rocha','(41) 98822-3344','8','R$ 790'],
['Juliana Alves','(41) 97731-5532','19','R$ 2.480'],
['Patrícia Melo','(41) 96641-8821','6','R$ 620']],
services:[
['Manicure Tradicional','45 min','R$ 35'],
['Pé + Mão','90 min','R$ 65'],
['Esmaltação em Gel','75 min','R$ 75'],
['Alongamento Fibra','150 min','R$ 160'],
['Manutenção de Fibra','120 min','R$ 95'],
['Spa dos Pés','60 min','R$ 70']]
};
let current='dashboard',bookStep=1,book={service:'',pro:'',time:''};
const root=document.getElementById('root');
const titles={dashboard:['Início','Resumo de hoje'],agenda:['Agenda','Seus horários'],clients:['Clientes','Sua base de clientes'],finance:['Caixa','Resumo financeiro'],more:['Mais','Outras funções'],services:['Serviços','Catálogo e preços'],whatsapp:['WhatsApp','Lembretes automáticos'],booking:['Agendar','Página da cliente']};
function side(){const n=[['dashboard','⌂','Início'],['agenda','▦','Agenda'],['clients','♙','Clientes'],['finance','R$','Caixa'],['services','◇','Serviços'],['whatsapp','◉','WhatsApp'],['booking','↗','Página pública']];return `<aside class="side"><div class="brand"><div class="logo">AN</div><div><b>Agenda Nails</b><small>PRO</small></div></div><nav class="nav">${n.map(x=>`<button class="${current===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</nav></aside>`}
function bottom(){const n=[['dashboard','⌂','Início'],['agenda','▦','Agenda'],['clients','♙','Clientes'],['finance','R$','Caixa'],['more','•••','Mais']];let active=['services','whatsapp'].includes(current)?'more':current;return `<nav class="bottom">${n.map(x=>`<button class="${active===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</nav>`}
function shell(content){let t=titles[current]||titles.dashboard;return `<div class="app">${side()}<main class="main"><header class="top"><div><h1>${t[0]}</h1><p>${t[1]}</p></div><div class="actions"><button class="btn secondary" onclick="go('booking')">Página pública</button><button class="btn primary" onclick="go('booking')">+ Agendar</button><div class="avatar">AS</div></div></header><div class="content">${content}</div></main>${bottom()}</div>`}
function appt(a,i){return `<div class="appointment"><b>${a[0]}</b><span class="line" style="background:${i%2?'#c5d9d1':'#d9aebe'}"></span><div><b>${a[1]}</b><small>${a[2]} · ${a[3]}</small></div><span class="status ${a[4]==='pending'?'pending':''}">${a[4]==='pending'?'Pendente':'Confirmado'}</span></div>`}
function dashboard(){return shell(`<section class="hero"><div><span class="eyebrow">Hoje</span><h2>Bom dia, <span>Ana.</span></h2><p>Veja os horários de hoje e o resumo do estúdio.</p></div><button class="btn primary" onclick="go('booking')">+ Novo agendamento</button></section><section class="metrics"><div class="metric"><span>Faturamento hoje</span><b>R$ 1.485</b><small class="positive">▲ 18%</small></div><div class="metric"><span>Agendamentos</span><b>14</b><small>11 confirmados</small></div><div class="metric"><span>Novas clientes</span><b>6</b><small>esta semana</small></div><div class="metric"><span>Ocupação</span><b>84%</b><small>da semana</small></div></section><div class="grid"><section class="panel"><div class="head"><div><span class="eyebrow">Hoje</span><h3>Próximos horários</h3></div><button class="btn secondary" onclick="go('agenda')">Ver agenda</button></div>${data.appointments.map(appt).join('')}</section><aside class="panel"><div class="head"><h3>Acesso rápido</h3></div><div class="quick"><button onclick="go('clients')">♡<b>Cliente</b><small>Cadastrar</small></button><button onclick="go('services')">◇<b>Serviços</b><small>Preços</small></button><button onclick="go('whatsapp')">◉<b>WhatsApp</b><small>Lembretes</small></button><button onclick="go('finance')">R$<b>Caixa</b><small>Resumo</small></button></div></aside></div>`)}
function agenda(){return shell(`<div class="toolbar"><input class="search" placeholder="Buscar cliente"><button class="btn primary" onclick="go('booking')">+ Horário</button></div><section class="panel"><div class="head"><div><span class="eyebrow">Hoje</span><h3>Agenda do dia</h3></div><span class="status">5 horários</span></div>${data.appointments.map(appt).join('')}</section>`)}
function clients(){return shell(`<div class="toolbar"><input class="search" placeholder="Buscar cliente"><button class="btn primary" onclick="toast('Cadastro de cliente aberto')">+ Cliente</button></div><div class="list">${data.clients.map((c,i)=>`<div class="card client"><div class="round">${c[0].split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><b>${c[0]}</b><small>${c[1]} · ${c[2]} visitas</small></div><div><b>${c[3]}</b><small>${i===2?'VIP':'Ativa'}</small></div></div>`).join('')}</div>`)}
function finance(){return shell(`<div class="financegrid"><div class="financecard"><span>Entradas no mês</span><b>R$ 18.940</b><small class="positive">▲ 12,4%</small></div><div class="financecard"><span>Despesas</span><b>R$ 5.280</b><small>Produtos e taxas</small></div><div class="financecard"><span>Saldo</span><b>R$ 13.660</b><small class="positive">Margem 72%</small></div></div><section class="panel"><div class="head"><h3>Últimos lançamentos</h3></div><div class="list">${[['Manicure em Gel · Mariana','+ R$ 75'],['Pé + Mão · Camila','+ R$ 65'],['Compra de esmaltes','− R$ 320'],['Alongamento · Juliana','+ R$ 160']].map(r=>`<div class="card" style="box-shadow:none;display:flex;justify-content:space-between;gap:12px"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div></section>`)}
function services(){return shell(`<div class="toolbar"><div><span class="eyebrow">Catálogo</span><h2 style="margin:3px 0">Serviços</h2></div><button class="btn primary" onclick="toast('Novo serviço aberto')">+ Serviço</button></div><div class="servicegrid">${data.services.map(s=>`<article class="service"><span class="eyebrow">Disponível</span><h3>${s[0]}</h3><p>Serviço disponível para agendamento online.</p><footer><span>${s[1]}</span><b>${s[2]}</b></footer></article>`).join('')}</div>`)}
function whatsapp(){const a=[['Confirmação de agendamento','Ao reservar um horário'],['Lembrete 24h antes','Reduz faltas'],['Lembrete 2h antes','Reforço no dia'],['Pós-atendimento','Pedido de avaliação']];return shell(`<section class="waHero"><div><span class="eyebrow" style="color:#e6cbd5">WhatsApp</span><h2 style="margin:5px 0">Lembretes automáticos</h2><p>Configure as mensagens que serão enviadas às clientes.</p></div><span class="status">● Conectado</span></section><div class="list">${a.map((x,i)=>`<div class="card auto"><div><b>${x[0]}</b><small style="display:block;color:var(--muted);margin-top:4px">${x[1]}</small></div><div class="toggle ${i<3?'on':''}" onclick="this.classList.toggle('on');toast('Automação atualizada')"></div></div>`).join('')}</div>`)}
function more(){return shell(`<div class="moregrid"><button class="moreitem" onclick="go('services')">◇<strong>Serviços</strong><small>Preços e duração</small></button><button class="moreitem" onclick="go('whatsapp')">◉<strong>WhatsApp</strong><small>Lembretes automáticos</small></button><button class="moreitem" onclick="go('booking')">↗<strong>Página pública</strong><small>Agendamento da cliente</small></button></div>`)}
function booking(){return `<div class="booking"><div class="bookingWrap"><section class="bookingBrand"><div class="logo">BN</div><span class="eyebrow">Bella Nails Studio</span><h1>Agende seu horário em poucos passos.</h1><p>Escolha o serviço, a profissional e o horário.</p><button class="btn secondary" onclick="go('dashboard')">← Painel</button></section><section class="bookCard"><div class="steps">${[1,2,3,4].map(i=>`<i class="${bookStep>=i?'on':''}"></i>`).join('')}</div>${bookingBody()}</section></div></div>`}
function bookingBody(){if(bookStep===1)return `<span class="eyebrow">Passo 1 de 4</span><h2>Escolha o serviço</h2><div class="choices">${data.services.slice(0,5).map(s=>`<div class="choice" onclick="chooseService('${s[0]}')"><div><b>${s[0]}</b><small>${s[1]}</small></div><b>${s[2]}</b></div>`).join('')}</div>`;
if(bookStep===2)return `<span class="eyebrow">Passo 2 de 4</span><h2>Escolha a profissional</h2><div class="choices">${[['Ana Souza','Especialista em gel'],['Bruna Lima','Manicure e pedicure'],['Carla Dias','Alongamentos']].map(p=>`<div class="choice" onclick="choosePro('${p[0]}')"><div><b>${p[0]}</b><small>${p[1]}</small></div><span>›</span></div>`).join('')}</div><button class="btn secondary" style="margin-top:10px" onclick="backBook()">← Voltar</button>`;
if(bookStep===3)return `<span class="eyebrow">Passo 3 de 4</span><h2>Escolha o horário</h2><p style="color:var(--muted)">Próximos horários disponíveis</p><div class="times">${['09:00','10:30','13:00','14:30','16:00','17:30'].map(t=>`<button onclick="chooseTime('${t}')">${t}</button>`).join('')}</div><button class="btn secondary" style="margin-top:10px" onclick="backBook()">← Voltar</button>`;
if(bookStep===4)return `<span class="eyebrow">Passo 4 de 4</span><h2>Seus dados</h2><div class="field"><span>NOME</span><input id="name" placeholder="Nome completo"></div><div class="field"><span>WHATSAPP</span><input id="phone" placeholder="(41) 99999-9999"></div><div class="card" style="box-shadow:none;margin:12px 0"><b>${book.service}</b><small style="display:block;color:var(--muted);margin-top:5px">${book.pro} · ${book.time}</small></div><button class="btn primary" style="width:100%;min-height:48px" onclick="confirmBook()">Confirmar horário</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="backBook()">Voltar</button>`;
return `<div class="success"><i>✓</i><span class="eyebrow">Confirmado</span><h2>Horário reservado!</h2><p>Seu agendamento de demonstração foi concluído.</p><div class="card" style="box-shadow:none;margin:16px 0"><b>${book.service}</b><small style="display:block;color:var(--muted);margin-top:5px">${book.pro} · ${book.time}</small></div><button class="btn primary" onclick="resetBook()">Novo agendamento</button></div>`}
function go(p){current=p;if(p!=='booking')bookStep=1;render();window.scrollTo(0,0)}
function chooseService(v){book.service=v;bookStep=2;render()}function choosePro(v){book.pro=v;bookStep=3;render()}function chooseTime(v){book.time=v;bookStep=4;render()}function backBook(){bookStep=Math.max(1,bookStep-1);render()}function confirmBook(){if(!document.getElementById('name').value||!document.getElementById('phone').value)return toast('Preencha nome e WhatsApp');bookStep=5;render()}function resetBook(){bookStep=1;book={service:'',pro:'',time:''};render()}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2200)}
function render(){if(current==='booking'){root.innerHTML=booking();return}let fn={dashboard,agenda,clients,finance,more,services,whatsapp}[current]||dashboard;root.innerHTML=fn()}
render();
</script>
</body>
</html>
